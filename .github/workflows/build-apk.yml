name: Build Android APK
run-name: "Build & Release EdWealth Android APK"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Required by Capacitor 8+)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21 (LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Grant Gradlew Permission
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EdWealth.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdWealth-debug-apk
          path: EdWealth.apk

      - name: Publish GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "EdWealth v1.0.3 (Official Android APK - Clean Zero Slate)"
          body: |
            ### 📱 EdWealth Android App v1.0.3
            
            Download the official Android APK directly below to install on your phone:
            - **Direct Download:** [EdWealth.apk](https://github.com/edwanannnn/EdWealth-/releases/download/v1.0.3/EdWealth.apk)
            
            #### Highlights & Clean Slate:
            - 🧹 **Pure Zero Starting Balance:** All accounts (Demo and newly registered Supabase accounts) start clean at exactly Rp 0 with no dummy balances.
            - 🎙️ **Manual Mic Trigger:** Voice logger activates only when you explicitly tap the mic button.
            - 🧭 **Android 3-Button Navigation Bar Inset:** `fitsSystemWindows` and elevated bottom nav bar so it never collides with Android's Back, Home, and Recents system buttons.
            - 📱 **Smooth Touch Scrolling:** Native vertical touch drag & scrolling.
            - 💵 **Dedicated Income & Passive Incomes:** Quick actions for "+ Pemasukan" and "+ Tambah Sumber Pasif".
            - 📈 Real-Time IDX Stock Portfolio (Yahoo Finance live feed)
          files: EdWealth.apk
