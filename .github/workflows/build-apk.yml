name: Build Android APK
run-name: "Build & Release EdWealth Android APK"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Required by Capacitor 8+)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21 (LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Grant Gradlew Permission
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EdWealth.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdWealth-debug-apk
          path: EdWealth.apk

      - name: Publish GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: "EdWealth v1.0.4 (Official Android APK - All Fixes Included)"
          body: |
            ### 📱 EdWealth Android App v1.0.4
            
            Download the official Android APK directly below to install on your phone:
            - **Direct Download:** [EdWealth.apk](https://github.com/edwanannnn/EdWealth-/releases/download/v1.0.4/EdWealth.apk)
            
            #### What's Included in v1.0.4:
            - 🎯 **Fixed Double '+' Signs:** Single clean buttons across Fixed & Passive, Stock Purchase, and Accounts.
            - ✏️ **Smooth Lot & Price Editing:** Can backspace, delete, and type any number in stock lots and buy/sell prices.
            - 📈 **Accurate Live Stock Prices:** Updated CUAN baseline to Rp 408 (post-split) and real-time Yahoo Finance feed.
            - 🎙️ **Smart Voice AI:** Native Android microphone recognition on tap + quick testing.
            - 🧭 **Android 3-Button Navigation Bar Inset:** `fitsSystemWindows` and elevated bottom nav bar so it never collides with Android's Back, Home, and Recents buttons.
            - 🧹 **Pure Zero Starting Balance:** All accounts start clean at Rp 0 for fresh users.
          files: EdWealth.apk
