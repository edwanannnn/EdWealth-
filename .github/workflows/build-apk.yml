name: Build Android APK
run-name: "Build & Release EdWealth Android APK"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Required by Capacitor 8+)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21 (LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Grant Gradlew Permission
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EdWealth.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdWealth-debug-apk
          path: EdWealth.apk

      - name: Publish GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: "EdWealth v1.0.1 (Official Android APK)"
          body: |
            ### 📱 EdWealth Android App v1.0.1
            
            Download the official Android APK directly below to install on your phone:
            - **Direct Download:** [EdWealth.apk](https://github.com/edwanannnn/EdWealth-/releases/download/v1.0.1/EdWealth.apk)
            
            #### Highlights & Fixes:
            - 📱 **Smooth Touch Scrolling:** Fixed vertical touch drag & scrolling for Android devices.
            - 💰 **Clean 0 Initial Balance:** New accounts start clean at Rp 0 with easy "Kelola Saldo" manager.
            - 💵 **Dedicated Income & Passive Incomes:** Quick actions for "+ Pemasukan" and "+ Tambah Sumber Pasif".
            - 🎙️ Smart AI Voice Expense Logger (0 External API Key)
            - 📈 Real-Time IDX Stock Portfolio (Yahoo Finance live feed)
            - ⚖️ Automated Broker Fee & Realized P/L Engine
            - 🎯 Financial Freedom Index Coverage Gauge
            - 🔒 Supabase PostgreSQL + Row Level Security
          files: EdWealth.apk
